# Overlay: build the image locally instead of pulling it from the registry.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# What for: trying a change that is not on main yet; running an instance that
# cannot reach the registry; or checking that a self-built image behaves like
# the published one. Normal operation does not need it — docker-compose.yml
# pulls the image the pipeline built and scanned.
#
# `image:` is deliberately OVERRIDDEN here. Without it Compose would build
# locally but tag the result with the registry name, and the next
# `docker compose pull` would silently replace it with the registry's image,
# without anyone noticing the local build was gone.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Fills /api/v1/version. Without these a self-built image reports
        # "dev"/"none"/"unknown", which after a rollback leaves the one question
        # that matters unanswered: what is running here right now.
        VERSION: ${VERSION:-compose}
        COMMIT: ${COMMIT:-none}
        DATE: ${BUILD_DATE:-unknown}
    image: statwarden:${VERSION:-latest}
