# sqlc — type-safe Go from hand-written SQL.
# Regenerate with: make sqlc  (go run github.com/sqlc-dev/sqlc/cmd/sqlc@latest generate)
version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
