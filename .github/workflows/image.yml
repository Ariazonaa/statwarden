name: Image

# Builds the container image, scans it, and only then publishes it to
# ghcr.io/ariazonaa/statwarden: on main as `latest` plus the short commit SHA,
# on a vX.Y.Z tag additionally as that version. Pull requests build and scan
# but never push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ariazonaa/statwarden

jobs:
  image:
    name: Build, scan, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME/\//-}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Scan a single-architecture build first. The push below happens only if
      # this step passes, so an image with a fixable CRITICAL or HIGH finding is
      # never published.
      - name: Build for scanning (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: statwarden:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.commit }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILT=${{ steps.meta.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: statwarden:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Tags
        id: tags
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.commit }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILT=${{ steps.meta.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
