name: Image

# Builds the container image, scans it, and only then publishes it to
# ghcr.io/ariazonaa/statwarden: on main as `latest` plus the short commit SHA,
# on a vX.Y.Z tag as X.Y.Z and X.Y (never `latest`). Pull requests build and
# scan but never push.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ariazonaa/statwarden

jobs:
  image:
    name: Build, scan, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same check as release.yml, and just as early: a tag whose version has
      # no CHANGELOG.md section gets no GitHub release, so it must not get a
      # version image either.
      - name: CHANGELOG.md has a section for this tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

      - name: Build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME/\//-}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scan a single-architecture build first. The push below happens only if
      # this step passes, so an image with a fixable CRITICAL or HIGH finding is
      # never published.
      - name: Build for scanning (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: statwarden:scan
          build-args: |
            VERSION=${{ steps.meta.outputs.commit }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILT=${{ steps.meta.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: statwarden:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Tags
        id: tags
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # metadata-action adds `latest` to every semver tag by default, which
          # would move `latest` back to a release commit behind main. `latest`
          # comes only from the explicit main-branch entry below.
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.meta.outputs.commit }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILT=${{ steps.meta.outputs.built }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
