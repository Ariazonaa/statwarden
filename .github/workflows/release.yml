name: Release

# A strict SemVer tag (vX.Y.Z) publishes static linux/amd64 and linux/arm64
# binaries with a SHA256SUMS file as a GitHub release. The image for the same
# tag is published by image.yml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but strict SemVer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          [[ "$TAG" =~ $semver ]] || { echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release text is the version's section of CHANGELOG.md, so the notes
      # on GitHub and the file in the repository cannot say different things.
      # It runs before any build so a tag without a changelog entry fails in
      # seconds; image.yml runs the same check, so it publishes no version
      # image for that tag either.
      - name: Release notes from CHANGELOG.md
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (embedded, real backend)
        working-directory: web
        env:
          VITE_USE_MOCK: "false"
        run: |
          npm ci
          npm run build
          npm run verify:no-mock

      - name: Build binaries and checksums
        env:
          CGO_ENABLED: "0"
          MODULE: github.com/Ariazonaa/statwarden
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          COMMIT=$(git rev-parse --short=12 HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist
          for GOARCH in amd64 arm64; do
            export GOOS=linux GOARCH
            for cmd in statwarden statwarden-cli; do
              OUT="dist/${cmd}-${VERSION}-linux-${GOARCH}"
              go build -trimpath \
                -ldflags "-s -w -X ${MODULE}/internal/version.Version=${VERSION} -X ${MODULE}/internal/version.Commit=${COMMIT} -X ${MODULE}/internal/version.Date=${DATE}" \
                -o "${OUT}" "./cmd/${cmd}"
              tar -czf "${OUT}.tar.gz" -C dist "$(basename "${OUT}")"
              rm -f "${OUT}"
            done
          done
          ( cd dist && sha256sum *.tar.gz | tee SHA256SUMS )

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
