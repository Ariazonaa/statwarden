version: 2
# Minor and patch updates are grouped into one pull request per ecosystem.
# Major updates stay one per pull request, because each can break the build
# on its own and has to be reviewed on its own. open-pull-requests-limit caps
# how many of those wait at once: the first run after this file was added
# opened thirteen at the same time.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      # @sveltejs/kit 2 accepts TypeScript up to 6 as a peer, so a major bump
      # fails npm ci until the SvelteKit upgrade lifts that range.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # adapter-static 4 requires @sveltejs/kit 3; it comes with that migration.
      - dependency-name: "@sveltejs/adapter-static"
        update-types: [version-update:semver-major]

  # Every action is pinned in the workflows and they move together, so one
  # pull request carries all of them, majors included.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # The Go build image has to match the go directive in go.mod (see the
      # comment there), and Dependabot can only move the image. Go is raised
      # by hand in both places; govulncheck in CI fails on any reachable
      # standard-library advisory, which is what prompts it.
      - dependency-name: golang
