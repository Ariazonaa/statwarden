name: Feature request
description: Suggest a new feature or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. Features are discussed here first;
        a pull request for an unannounced feature may be declined even if it is good.
  - type: textarea
    id: problem
    attributes:
      label: Which problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
