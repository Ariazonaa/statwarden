<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="description" content="Statwarden — self-hosted uptime monitoring" />
		<title>Statwarden</title>
		<script>
			// Statwarden ships dark only. Stamp the theme before first paint so there
			// is never a flash of an unstyled/wrong background.
			document.documentElement.dataset.theme = 'dark';
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
